name: Tests

on:
  push:
    branches: [main, 'refine/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        # Note: React 19 compatibility in @testing-library/react is still in progress.
        # Using --legacy-peer-deps is a temporary workaround until Testing Library
        # releases official React 19 support. See: https://github.com/testing-library/react-testing-library/discussions

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit + Integration Tests
        run: npm test -- run

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        if: env.AI_GATEWAY_API_KEY != ''
        run: npm run test:e2e
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
